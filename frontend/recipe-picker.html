<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipes · Cooking Orchestrator</title>
  <style>
    :root {
      color-scheme: light dark;
      --paper: light-dark(#faf8f2, #181e1b);
      --ink: light-dark(#20342c, #f0f2e9);
      --muted: light-dark(#56685d, #bdc8bc);
      --line: light-dark(#ced4c7, #505c54);
      --accent: light-dark(#285741, #b9d8b7);
      font: 100%/1.5 "DM Sans", system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    body { margin: 0; }
    main { max-width: 54rem; margin: 0 auto; padding: clamp(2rem, 8vh, 5rem) clamp(1.25rem, 5vw, 3rem); }
    header { border-bottom: 2px solid var(--accent); }
    header p { margin: 0; color: var(--accent); font-weight: 600; }
    h1 { margin: .3em 0 .55em; font: 500 clamp(2.8rem, 7vw, 5rem)/1.05 Georgia, serif; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { border-bottom: 1px solid var(--line); }
    a {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: .35rem 1rem;
      padding: 1.25rem .5rem;
      color: inherit;
      text-decoration: none;
    }
    a:hover, a:focus-visible { background: light-dark(#eef1e8, #242e27); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .name { font: 500 clamp(1.4rem, 3.2vw, 2rem)/1.2 Georgia, serif; overflow-wrap: anywhere; }
    .servings { grid-column: 1; color: var(--muted); font-size: .9rem; }
    .arrow { grid-column: 2; grid-row: 1 / 3; color: var(--accent); font-size: 1.45rem; }
  </style>
</head>
<body>
  <main>
    <header><p>Cooking Orchestrator</p><h1>Choose a recipe</h1></header>
    $recipe_list
  </main>
</body>
</html>
